[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-posture-fall-detection"
version = "0.1.0"
description = "Offline multi-person pose, posture and temporal fall detection"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<5", "onnxruntime>=1.20,<2", "PyYAML>=6,<7", "scipy>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "onnx>=1.17"]
training = ["torch>=2.4", "onnx>=1.17"]

[tool.setuptools.packages.find]
include = ["src*", "training*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
